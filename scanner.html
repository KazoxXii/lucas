<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner un plat | VOIR MON PLAT+</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }

        /* CAMERA VIEW */
        .scanner-container {
            position: fixed;
            inset: 0;
            background: #000;
        }

        #cameraFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .scanner-frame {
            width: 280px;
            height: 280px;
            position: relative;
        }

        .scanner-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #f5a623;
            border-style: solid;
        }

        .scanner-corner.tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 8px 0 0 0; }
        .scanner-corner.tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 8px 0 0; }
        .scanner-corner.bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 8px; }
        .scanner-corner.br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 8px 0; }

        .scanner-line {
            position: absolute;
            left: 10px;
            right: 10px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f5a623, transparent);
            box-shadow: 0 0 15px rgba(245, 166, 35, 0.6);
            animation: scanLine 2s ease-in-out infinite;
        }

        @keyframes scanLine {
            0%, 100% { top: 10px; }
            50% { top: calc(100% - 10px); }
        }

        .scanner-text {
            margin-top: 2rem;
            font-size: 1rem;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            text-align: center;
        }

        .scanner-text span {
            color: #f5a623;
            font-weight: 600;
        }

        /* TOP BAR */
        .scanner-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 10;
        }

        .scanner-back {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .scanner-back:hover { background: rgba(255,255,255,0.2); }

        .scanner-title {
            font-weight: 700;
            font-size: 1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .scanner-flash {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .scanner-flash.active { background: #f5a623; color: #000; }

        /* BOTTOM CONTROLS */
        .scanner-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem 1rem 3rem;
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .scan-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid #fff;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .scan-btn::after {
            content: '';
            position: absolute;
            inset: 6px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .scan-btn:active::after {
            background: #f5a623;
            transform: scale(0.9);
        }

        .scan-btn.scanning {
            border-color: #f5a623;
            animation: pulseBtn 1.5s ease-in-out infinite;
        }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .scan-options {
            display: flex;
            gap: 2rem;
        }

        .scan-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 0.75rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .scan-option:hover { opacity: 1; }
        .scan-option .icon { font-size: 1.5rem; }

        /* 3D VIEWER */
        .viewer-3d {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: none;
            z-index: 100;
        }

        .viewer-3d.active { display: block; }

        #viewer3dCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .viewer-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 10;
        }

        .viewer-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .viewer-title {
            font-weight: 700;
        }

        .viewer-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 1rem 3rem;
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 10;
        }

        .dish-info {
            text-align: center;
            margin-bottom: 1rem;
        }

        .dish-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .dish-price {
            color: #f5a623;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .dish-desc {
            color: #999;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .viewer-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .viewer-ctrl-btn {
            padding: 0.7rem 1.5rem;
            border-radius: 25px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .viewer-ctrl-btn.primary {
            background: #f5a623;
            color: #000;
        }

        .viewer-ctrl-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .rotation-hint {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-top: 0.75rem;
        }

        /* LOADING */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10,10,10,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 200;
        }

        .loading-overlay.active { display: flex; }

        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid #222;
            border-top-color: #f5a623;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            color: #999;
            font-size: 0.9rem;
        }

        /* PLAT LIST */
        .plat-list-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10,10,10,0.95);
            display: none;
            z-index: 150;
            flex-direction: column;
        }

        .plat-list-overlay.active { display: flex; }

        .plat-list-header {
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .plat-list-header h2 { font-size: 1.2rem; }

        .plat-list-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #1a1a1a;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .plat-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .plat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .plat-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .plat-card:hover {
            border-color: #f5a623;
            transform: translateY(-2px);
        }

        .plat-card-img {
            width: 100%;
            aspect-ratio: 1;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .plat-card-info {
            padding: 0.75rem;
        }

        .plat-card-name {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
        }

        .plat-card-price {
            color: #f5a623;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .plat-card-desc {
            color: #666;
            font-size: 0.75rem;
            margin-top: 0.2rem;
        }

        /* CATEGORY FILTERS */
        .cat-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #999;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cat-btn:hover { border-color: #f5a623; color: #fff; }

        .cat-btn.active {
            background: #f5a623;
            border-color: #f5a623;
            color: #000;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- CAMERA SCANNER -->
    <div class="scanner-container" id="scannerView">
        <video id="cameraFeed" autoplay playsinline></video>

        <div class="scanner-topbar">
            <button class="scanner-back" onclick="history.back()">←</button>
            <span class="scanner-title">Scanner un plat</span>
            <button class="scanner-flash" id="flashBtn" onclick="toggleFlash()">⚡</button>
        </div>

        <div class="scanner-overlay">
            <div class="scanner-frame">
                <div class="scanner-corner tl"></div>
                <div class="scanner-corner tr"></div>
                <div class="scanner-corner bl"></div>
                <div class="scanner-corner br"></div>
                <div class="scanner-line"></div>
            </div>
            <div class="scanner-text">Placez le plat <span>dans le cadre</span></div>
        </div>

        <div class="scanner-bottom">
            <div class="scan-options">
                <button class="scan-option" onclick="showPlatList()">
                    <span class="icon">📋</span>
                    <span>Menu</span>
                </button>
                <button class="scan-option" onclick="simulateScan()">
                    <span class="icon">🎯</span>
                    <span>Demo scan</span>
                </button>
                <button class="scan-option" onclick="switchCamera()">
                    <span class="icon">🔄</span>
                    <span>Camera</span>
                </button>
            </div>
            <button class="scan-btn" id="scanBtn" onclick="simulateScan()"></button>
        </div>
    </div>

    <!-- 3D VIEWER -->
    <div class="viewer-3d" id="viewer3d">
        <canvas id="viewer3dCanvas"></canvas>

        <div class="viewer-topbar">
            <button class="viewer-close" onclick="closeViewer()">×</button>
            <span class="viewer-title">Vision 360°</span>
            <div style="width:40px;"></div>
        </div>

        <div class="viewer-bottom">
            <div class="dish-info">
                <div class="dish-name" id="dishName">Burger Maison</div>
                <div class="dish-price" id="dishPrice">14,90 €</div>
                <div class="dish-desc" id="dishDesc">Steak Angus, cheddar affiné, légumes frais</div>
            </div>
            <div class="viewer-controls">
                <button class="viewer-ctrl-btn secondary" onclick="toggleAutoRotate()">🔄 Auto-rotation</button>
                <button class="viewer-ctrl-btn primary" onclick="closeViewer()">📸 Prendre en photo</button>
            </div>
            <div class="rotation-hint">Glisse pour tourner le plat en 360°</div>
        </div>
    </div>

    <!-- PLAT LIST -->
    <div class="plat-list-overlay" id="platList">
        <div class="plat-list-header">
            <h2>Choisir un plat</h2>
            <button class="plat-list-close" onclick="closePlatList()">×</button>
        </div>
        <div style="padding:0.75rem 1rem;border-bottom:1px solid #222;">
            <input type="text" id="platSearch" placeholder="🔍 Rechercher un plat..." oninput="searchPlats()" style="width:100%;padding:0.7rem 1rem;background:#1a1a1a;border:1px solid #333;border-radius:10px;color:#fff;font-size:0.9rem;outline:none;">
        </div>
        <div style="padding:0.5rem 1rem;overflow-x:auto;white-space:nowrap;display:flex;gap:0.5rem;border-bottom:1px solid #222;" id="catFilters">
            <button class="cat-btn active" onclick="filterPlats('all')">Tous</button>
        </div>
        <div class="plat-list">
            <div class="plat-grid" id="platGrid"></div>
        </div>
    </div>

    <!-- LOADING -->
    <div class="loading-overlay" id="loading">
        <div class="loader"></div>
        <div class="loading-text">Chargement du rendu 3D...</div>
    </div>

        // Catégories pour filtre
        const categories = [...new Set(plats.map(p => p.category))];

        let scene, camera, renderer, currentMesh, autoRotate = true, isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraStream = null;
        let facingMode = 'environment';

        // CAMERA
        async function startCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };
                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                const video = document.getElementById('cameraFeed');
                video.srcObject = cameraStream;
            } catch (err) {
                console.log('Camera non disponible, mode demo');
            }
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
        }

        function switchCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            stopCamera();
            startCamera();
        }

        async function toggleFlash() {
            const btn = document.getElementById('flashBtn');
            if (cameraStream) {
                const track = cameraStream.getVideoTracks()[0];
                const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                if (capabilities.torch) {
                    const settings = track.getSettings();
                    await track.applyConstraints({
                        advanced: [{ torch: !settings.torch }]
                    });
                    btn.classList.toggle('active');
                }
            }
        }

        // PLAT LIST
        function showPlatList() {
            const grid = document.getElementById('platGrid');
            renderPlats(grid, plats);
            document.getElementById('platList').classList.add('active');
        }

        function renderPlats(grid, list) {
            grid.innerHTML = list.map(p => `
                <div class="plat-card" onclick="selectPlat(${p.id})">
                    <div class="plat-card-img">${p.emoji}</div>
                    <div class="plat-card-info">
                        <div class="plat-card-name">${p.name}</div>
                        <div class="plat-card-price">${p.price}</div>
                        <div class="plat-card-desc">${p.desc}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterPlats(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            const grid = document.getElementById('platGrid');
            if (cat === 'all') {
                renderPlats(grid, plats);
            } else {
                renderPlats(grid, plats.filter(p => p.category === cat));
            }
        }

        function closePlatList() {
            document.getElementById('platList').classList.remove('active');
        }

        function searchPlats() {
            const query = document.getElementById('platSearch').value.toLowerCase();
            const grid = document.getElementById('platGrid');
            const filtered = plats.filter(p => p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            renderPlats(grid, filtered);
        }

        // Init category filters
        function initCategoryFilters() {
            const container = document.getElementById('catFilters');
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.textContent = cat;
                btn.onclick = function() { filterPlats(cat); };
                container.appendChild(btn);
            });
        }
        initCategoryFilters();

        function selectPlat(id) {
            closePlatList();
            const plat = plats.find(p => p.id === id);
            if (plat) openViewer(plat);
        }

        // SCAN SIMULATION
        function simulateScan() {
            const btn = document.getElementById('scanBtn');
            btn.classList.add('scanning');
            showScanOverlay();
        }

        function showScanOverlay() {
            const overlay = document.createElement('div');
            overlay.id = 'scanProgressOverlay';
            overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;';
            overlay.innerHTML = `
                <div style="position:relative;width:200px;height:200px;">
                    <svg width="200" height="200" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="90" fill="none" stroke="#222" stroke-width="6"/>
                        <circle id="scanCircle" cx="100" cy="100" r="90" fill="none" stroke="#f5a623" stroke-width="6" stroke-dasharray="565.48" stroke-dashoffset="565.48" stroke-linecap="round" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset 0.1s linear;"/>
                        <circle cx="100" cy="100" r="70" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="8 4"/>
                    </svg>
                    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                        <span id="scanPercent" style="font-size:2.5rem;font-weight:900;color:#f5a623;">0%</span>
                        <span style="font-size:0.8rem;color:#999;margin-top:0.25rem;">Analyse en cours</span>
                    </div>
                </div>
                <div style="text-align:center;">
                    <div id="scanStatus" style="color:#fff;font-size:1rem;font-weight:600;margin-bottom:0.5rem;">Initialisation du scan...</div>
                    <div id="scanDetail" style="color:#666;font-size:0.85rem;">Detection du contour du plat</div>
                </div>
                <div style="width:250px;height:4px;background:#222;border-radius:2px;overflow:hidden;">
                    <div id="scanBar" style="width:0%;height:100%;background:#f5a623;border-radius:2px;transition:width 0.1s linear;"></div>
                </div>
            `;
            document.body.appendChild(overlay);

            const circle = document.getElementById('scanCircle');
            const percent = document.getElementById('scanPercent');
            const bar = document.getElementById('scanBar');
            const status = document.getElementById('scanStatus');
            const detail = document.getElementById('scanDetail');
            const circumference = 2 * Math.PI * 90;

            const steps = [
                { p: 5, s: 'Detection du plat...', d: 'Analyse du contour', t: 200 },
                { p: 15, s: 'Scan du contour...', d: 'Reconnaissance de la forme', t: 200 },
                { p: 25, s: 'Analyse des couleurs...', d: 'Capture des textures', t: 200 },
                { p: 35, s: 'Scan de la surface...', d: 'Mesure de la profondeur', t: 150 },
                { p: 45, s: 'Analyse des details...', d: 'Detection des ingredients', t: 150 },
                { p: 55, s: 'Scan 360° en cours...', d: 'Rotation et capture multiple', t: 150 },
                { p: 65, s: 'Reconstruction 3D...', d: 'Generation du maillage', t: 150 },
                { p: 75, s: 'Application des textures...', d: 'Rendu haute definition', t: 150 },
                { p: 85, s: 'Eclairage dynamique...', d: 'Calcul des ombres', t: 150 },
                { p: 92, s: 'Finalisation...', d: 'Optimisation du rendu', t: 200 },
                { p: 100, s: 'Scan termine !', d: 'Plat detecte avec succes', t: 300 }
            ];

            let i = 0;
            function nextStep() {
                if (i >= steps.length) {
                    setTimeout(() => {
                        overlay.remove();
                        document.getElementById('scanBtn').classList.remove('scanning');
                        const randomPlat = plats[Math.floor(Math.random() * plats.length)];
                        openViewer(randomPlat);
                    }, 500);
                    return;
                }
                const step = steps[i];
                const offset = circumference - (step.p / 100) * circumference;
                circle.style.strokeDashoffset = offset;
                percent.textContent = step.p + '%';
                bar.style.width = step.p + '%';
                status.textContent = step.s;
                detail.textContent = step.d;
                i++;
                setTimeout(nextStep, step.t);
            }
            nextStep();
        }

        // 3D VIEWER
        function openViewer(plat) {
            document.getElementById('loading').classList.add('active');

            setTimeout(() => {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('viewer3d').classList.add('active');
                document.getElementById('dishName').textContent = plat.name;
                document.getElementById('dishPrice').textContent = plat.price;
                document.getElementById('dishDesc').textContent = plat.desc;

                init3D(plat);
            }, 600);
        }

        function closeViewer() {
            document.getElementById('viewer3d').classList.remove('active');
            if (renderer) {
                renderer.dispose();
                renderer = null;
            }
            const canvas = document.getElementById('viewer3dCanvas');
            canvas.remove();
            const newCanvas = document.createElement('canvas');
            newCanvas.id = 'viewer3dCanvas';
            document.getElementById('viewer3d').insertBefore(newCanvas, document.getElementById('viewer3d').firstChild);
        }

        function init3D(plat) {
            const canvas = document.getElementById('viewer3dCanvas');
            const container = document.getElementById('viewer3d');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 4);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1);
            mainLight.position.set(5, 10, 5);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 1024;
            mainLight.shadow.mapSize.height = 1024;
            scene.add(mainLight);

            const warmLight = new THREE.PointLight(0xf5a623, 0.5, 10);
            warmLight.position.set(-3, 3, 2);
            scene.add(warmLight);

            const rimLight = new THREE.PointLight(0xffffff, 0.3, 10);
            rimLight.position.set(3, 2, -3);
            scene.add(rimLight);

            // Plate (base)
            const plateGeo = new THREE.CylinderGeometry(1.5, 1.4, 0.15, 64);
            const plateMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                metalness: 0.1,
                roughness: 0.3
            });
            const plate = new THREE.Mesh(plateGeo, plateMat);
            plate.position.y = -0.5;
            plate.castShadow = true;
            plate.receiveShadow = true;
            scene.add(plate);

            // Plate rim
            const rimGeo = new THREE.TorusGeometry(1.45, 0.05, 16, 64);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, metalness: 0.3, roughness: 0.2 });
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.position.y = -0.42;
            rim.rotation.x = Math.PI / 2;
            scene.add(rim);

            // Food
            let foodGeo, foodMat, food;
            const mainColor = plat.color;

            if (plat.shape === 'cylinder') {
                foodGeo = new THREE.CylinderGeometry(1, 1.1, 0.6, 32);
                foodMat = new THREE.MeshStandardMaterial({
                    color: mainColor,
                    roughness: 0.6,
                    metalness: 0.1
                });
                food = new THREE.Mesh(foodGeo, foodMat);
                food.position.y = -0.1;
            } else if (plat.shape === 'box') {
                foodGeo = new THREE.BoxGeometry(1.8, 0.5, 1.4, 4, 4, 4);
                foodMat = new THREE.MeshStandardMaterial({
                    color: mainColor,
                    roughness: 0.7,
                    metalness: 0.05
                });
                food = new THREE.Mesh(foodGeo, foodMat);
                food.position.y = -0.15;

                // Deform for realism
                const positions = food.geometry.attributes.position;
                for (let i = 0; i < positions.count; i++) {
                    positions.setY(i, positions.getY(i) + (Math.random() - 0.5) * 0.05);
                    positions.setX(i, positions.getX(i) + (Math.random() - 0.5) * 0.03);
                    positions.setZ(i, positions.getZ(i) + (Math.random() - 0.5) * 0.03);
                }
                positions.needsUpdate = true;
                food.geometry.computeVertexNormals();
            } else {
                // Cone for ice cream
                foodGeo = new THREE.ConeGeometry(0.6, 1, 32);
                foodMat = new THREE.MeshStandardMaterial({ color: mainColor, roughness: 0.5 });
                food = new THREE.Mesh(foodGeo, foodMat);
                food.position.y = 0.2;
                food.rotation.x = Math.PI;
            }

            food.castShadow = true;
            scene.add(food);

            // Garnish details
            addGarnish(plat);

            // Ground shadow
            const groundGeo = new THREE.PlaneGeometry(10, 10);
            const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.58;
            ground.receiveShadow = true;
            scene.add(ground);

            // Interaction
            setupInteraction(canvas);

            // Animate
            autoRotate = true;
            animate();
        }

        function addGarnish(plat) {
            // Small decorative elements
            const colors = [0x228B22, 0xFF6347, 0xFFD700, 0x8B4513];

            for (let i = 0; i < 5; i++) {
                const size = 0.05 + Math.random() * 0.08;
                const geo = new THREE.SphereGeometry(size, 8, 8);
                const mat = new THREE.MeshStandardMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    roughness: 0.5
                });
                const garnish = new THREE.Mesh(geo, mat);
                const angle = (i / 5) * Math.PI * 2;
                const radius = 0.5 + Math.random() * 0.5;
                garnish.position.set(
                    Math.cos(angle) * radius,
                    -0.1 + Math.random() * 0.3,
                    Math.sin(angle) * radius
                );
                garnish.castShadow = true;
                scene.add(garnish);
            }
        }

        function setupInteraction(canvas) {
            canvas.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
                autoRotate = false;
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!isDragging || !currentMesh) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                currentMesh.rotation.y += deltaX * 0.01;
                currentMesh.rotation.x += deltaY * 0.005;
                currentMesh.rotation.x = Math.max(-0.5, Math.min(0.5, currentMesh.rotation.x));
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            canvas.addEventListener('pointerup', () => { isDragging = false; });
            canvas.addEventListener('pointerleave', () => { isDragging = false; });

            // Zoom with scroll
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.z = Math.max(2, Math.min(6, camera.position.z + e.deltaY * 0.005));
            }, { passive: false });

            // Pinch zoom
            let lastTouchDistance = 0;
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    lastTouchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const delta = lastTouchDistance - dist;
                    camera.position.z = Math.max(2, Math.min(6, camera.position.z + delta * 0.01));
                    lastTouchDistance = dist;
                }
            });
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
        }

        function animate() {
            if (!renderer || !document.getElementById('viewer3d').classList.contains('active')) return;
            requestAnimationFrame(animate);

            if (autoRotate && currentMesh) {
                currentMesh.rotation.y += 0.008;
            }

            // Subtle float
            if (currentMesh) {
                currentMesh.position.y = Math.sin(Date.now() * 0.001) * 0.05;
            }

            renderer.render(scene, camera);
        }

        // Find main mesh for rotation
        const origInit3D = init3D;
        init3D = function(plat) {
            origInit3D(plat);
            currentMesh = scene.children.find(c => c.isMesh && c.geometry.type !== 'PlaneGeometry' && c.geometry.type !== 'TorusGeometry');
            if (!currentMesh) {
                currentMesh = scene.children.find(c => c.isMesh && c.geometry.type !== 'PlaneGeometry');
            }
        };

        // Resize
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Init camera
        startCamera();
    </script>

</body>
</html>
