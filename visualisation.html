<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualisation 3D | VOIR MON PLAT+</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --noir: #0a0a0a;
            --noir-card: #111111;
            --jaune: #f5a623;
            --jaune-clair: #fbbf24;
            --blanc: #ffffff;
            --gris: #999999;
            --bordure: #222222;
        }

        html, body { height: 100%; background: var(--noir); overflow: hidden; }
        body { font-family: 'Inter', -apple-system, sans-serif; color: var(--blanc); }

        /* VIEWER FULLSCREEN */
        .viewer-wrap {
            position: fixed; inset: 0; display: flex; flex-direction: column;
        }

        .viewer-topbar {
            position: absolute; top: 0; left: 0; right: 0; z-index: 20;
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 1.5rem;
            background: linear-gradient(180deg, rgba(10,10,10,0.85) 0%, transparent 100%);
        }

        .viewer-brand {
            display: flex; align-items: center; gap: 0.5rem;
            color: var(--blanc); text-decoration: none;
        }

        .viewer-brand img { height: 28px; border-radius: 4px; }
        .viewer-brand .logo-text { font-size: 1.1rem; font-weight: 800; }
        .viewer-brand .plus { color: var(--jaune); }

        /* Dish selector pills */
        .dish-pills {
            display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
            max-width: 500px;
        }

        .dish-pill {
            padding: 6px 14px; border-radius: 100px; border: 1px solid var(--bordure);
            background: rgba(17,17,17,0.8); backdrop-filter: blur(8px);
            color: var(--gris); cursor: pointer; font-size: 0.8rem;
            transition: all 0.3s; user-select: none; white-space: nowrap;
        }

        .dish-pill:hover { border-color: var(--jaune); color: var(--blanc); }
        .dish-pill.active { background: var(--jaune); color: #000; border-color: var(--jaune); font-weight: 600; }

        /* model-viewer fills the screen */
        .viewer-model {
            flex: 1; width: 100%; position: relative;
        }

        model-viewer {
            width: 100%; height: 100%;
            --poster-color: transparent;
            outline: none;
        }

        /* Bottom info */
        .viewer-bottom {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
            padding: 1.5rem 1.5rem 2rem;
            background: linear-gradient(0deg, rgba(10,10,10,0.85) 0%, transparent 100%);
            display: flex; justify-content: space-between; align-items: flex-end;
            flex-wrap: wrap; gap: 1rem;
        }

        .dish-info h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.2rem; }
        .dish-info .price { color: var(--jaune); font-size: 1.1rem; font-weight: 700; }
        .dish-info .desc { color: var(--gris); font-size: 0.85rem; margin-top: 0.2rem; }

        .viewer-actions { display: flex; gap: 8px; }

        .action-btn {
            width: 44px; height: 44px; border-radius: 50%;
            border: 1px solid var(--bordure); background: rgba(17,17,17,0.8);
            backdrop-filter: blur(8px); color: var(--blanc);
            font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
        }

        .action-btn:hover { border-color: var(--jaune); }
        .action-btn.active { background: var(--jaune); color: #000; border-color: var(--jaune); }

        .hint-badge {
            position: absolute; top: 5.5rem; left: 50%; transform: translateX(-50%);
            z-index: 20; background: rgba(245,166,35,0.1); border: 1px solid rgba(245,166,35,0.25);
            color: var(--jaune); padding: 6px 18px; border-radius: 100px;
            font-size: 0.8rem; font-weight: 500; pointer-events: none;
        }

        .no-model-msg {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 1rem; padding: 2rem; text-align: center;
        }

        .no-model-msg .icon { font-size: 3rem; opacity: 0.3; }
        .no-model-msg h3 { font-size: 1.1rem; }
        .no-model-msg p { color: var(--gris); font-size: 0.85rem; max-width: 300px; line-height: 1.5; }
        .no-model-msg code {
            background: rgba(245,166,35,0.1); color: var(--jaune);
            padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem;
        }

        @media (max-width: 768px) {
            .viewer-topbar { flex-direction: column; gap: 8px; padding: 0.75rem 1rem; }
            .dish-pills { max-width: 100%; }
            .dish-pill { font-size: 0.7rem; padding: 5px 10px; }
            .viewer-bottom { flex-direction: column; align-items: stretch; }
            .hint-badge { top: 6rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

                <button class="action-btn" id="btnReset" title="Réinitialiser" onclick="resetView()">↺</button>
                <a href="scanner.html" class="action-btn" title="Scanner ce plat" style="text-decoration:none;">📷</a>

        </div>
    </div>

        let currentMV = null;
        let currentPlat = plats.find(p => p.id === 11) || plats[0]; // Default: Burger

        function init() {
            buildPills();
            loadPlat(currentPlat);
        }

        function buildPills() {
            const container = document.getElementById('dishPills');
            container.innerHTML = plats.map(p =>
                `<div class="dish-pill ${p.id === currentPlat.id ? 'active' : ''}" data-id="${p.id}" onclick="selectPlat(${p.id})">${p.emoji} ${p.name}</div>`
            ).join('');
        }

        function selectPlat(id) {
            currentPlat = plats.find(p => p.id === id);
            if (!currentPlat) return;
            document.querySelectorAll('.dish-pill').forEach(p => p.classList.remove('active'));
            document.querySelector(`.dish-pill[data-id="${id}"]`)?.classList.add('active');
            loadPlat(currentPlat);
        }

        function loadPlat(plat) {
            document.getElementById('dishName').textContent = plat.name;
            document.getElementById('dishPrice').textContent = plat.price;
            document.getElementById('dishDesc').textContent = plat.desc;

            const slot = document.getElementById('viewerSlot');
            const noModel = document.getElementById('noModelMsg');
            slot.innerHTML = '';
            noModel.style.display = 'none';

            const glbPath = GLB_MODELS[plat.id];
            if (!glbPath) {
                noModel.style.display = 'flex';
                return;
            }

            const mv = document.createElement('model-viewer');
            mv.setAttribute('src', glbPath);
            mv.setAttribute('alt', 'Vue 3D de ' + plat.name);
            mv.setAttribute('camera-controls', '');
            mv.setAttribute('touch-action', 'pan-y');
            mv.setAttribute('auto-rotate', '');
            mv.setAttribute('auto-rotate-delay', '1000');
            mv.setAttribute('rotation-per-second', '25deg');
            mv.setAttribute('shadow-intensity', '1.2');
            mv.setAttribute('shadow-softness', '0.5');
            mv.setAttribute('exposure', '1.1');
            mv.setAttribute('environment-image', 'neutral');
            mv.setAttribute('camera-orbit', '45deg 55deg 2.5m');
            mv.setAttribute('min-camera-orbit', 'auto auto 1.5m');
            mv.setAttribute('max-camera-orbit', 'Infinity Infinity 5m');
            mv.style.cssText = 'width:100%;height:100%;background:radial-gradient(ellipse at center,#181818 0%,#0a0a0a 100%);';

            mv.addEventListener('error', () => {
                slot.innerHTML = '';
                noModel.style.display = 'flex';
            });

            slot.appendChild(mv);
            currentMV = mv;
        }

        function toggleAutoRotate() {
            if (!currentMV) return;
            const btn = document.getElementById('btnAutoRotate');
            if (currentMV.autoRotate) {
                currentMV.removeAttribute('auto-rotate');
                btn.classList.remove('active');
            } else {
                currentMV.setAttribute('auto-rotate', '');
                btn.classList.add('active');
            }
        }

        function resetView() {
            if (!currentMV) return;
            currentMV.cameraOrbit = '45deg 55deg 2.5m';
            currentMV.cameraTarget = '0m 0m 0m';
        }

        init();
